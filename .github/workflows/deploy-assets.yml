name: Deploy Brand Assets to Cloudflare R2

on:
  push:
    branches:
      - main
    paths:
      - 'icons/**'
      - 'logo/**'
      - 'colors/**'
      - 'guildlines/**'
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force re-upload all files (ignore checksums)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: deploy-assets
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync changed assets to Cloudflare R2
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}

    steps:
      - name: Checkout repository
        # pinned to commit SHA for supply-chain security (actions/checkout v4.2.2)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Configure AWS CLI for Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          aws configure set aws_access_key_id     "$AWS_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
          aws configure set region auto
          aws configure set output json

      # ---------------------------------------------------------------
      # Each sync step:
      #   1. Runs --dryrun to check if any files would be uploaded.
      #   2. If nothing changed -> skip (file already exists in R2).
      #   3. If new/changed files found -> run the real sync.
      #
      # aws s3 sync compares ETag (MD5) by default, so identical files
      # that already exist in R2 are NEVER re-uploaded.
      # --exact-timestamps uses mtime as an additional filter.
      # ---------------------------------------------------------------

      - name: Sync icons/
        run: |
          EXTRA=""
          [ "${{ inputs.force_sync }}" = "true" ] && EXTRA="--size-only"

          DRYRUN=$(aws s3 sync icons/ "s3://${R2_BUCKET}/icons/" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public, max-age=31536000, immutable" \
            --exact-timestamps \
            --dryrun $EXTRA 2>&1)

          if [ -z "$DRYRUN" ]; then
            echo "icons/ -- no new or changed files, skipping"
          else
            echo "New/changed files in icons/:"
            echo "$DRYRUN"
            aws s3 sync icons/ "s3://${R2_BUCKET}/icons/" \
              --endpoint-url "$R2_ENDPOINT" \
              --cache-control "public, max-age=31536000, immutable" \
              --exact-timestamps $EXTRA
            echo "icons/ synced"
          fi

      - name: Sync logo/badge/
        run: |
          EXTRA=""
          [ "${{ inputs.force_sync }}" = "true" ] && EXTRA="--size-only"

          DRYRUN=$(aws s3 sync logo/badge/ "s3://${R2_BUCKET}/logo/badge/" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public, max-age=31536000, immutable" \
            --exact-timestamps \
            --dryrun $EXTRA 2>&1)

          if [ -z "$DRYRUN" ]; then
            echo "logo/badge/ -- no new or changed files, skipping"
          else
            echo "New/changed files in logo/badge/:"
            echo "$DRYRUN"
            aws s3 sync logo/badge/ "s3://${R2_BUCKET}/logo/badge/" \
              --endpoint-url "$R2_ENDPOINT" \
              --cache-control "public, max-age=31536000, immutable" \
              --exact-timestamps $EXTRA
            echo "logo/badge/ synced"
          fi

      - name: Sync logo/icons/
        run: |
          EXTRA=""
          [ "${{ inputs.force_sync }}" = "true" ] && EXTRA="--size-only"

          DRYRUN=$(aws s3 sync logo/icons/ "s3://${R2_BUCKET}/logo/icons/" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public, max-age=31536000, immutable" \
            --exact-timestamps \
            --dryrun $EXTRA 2>&1)

          if [ -z "$DRYRUN" ]; then
            echo "logo/icons/ -- no new or changed files, skipping"
          else
            echo "New/changed files in logo/icons/:"
            echo "$DRYRUN"
            aws s3 sync logo/icons/ "s3://${R2_BUCKET}/logo/icons/" \
              --endpoint-url "$R2_ENDPOINT" \
              --cache-control "public, max-age=31536000, immutable" \
              --exact-timestamps $EXTRA
            echo "logo/icons/ synced"
          fi

      - name: Sync colors/
        run: |
          EXTRA=""
          [ "${{ inputs.force_sync }}" = "true" ] && EXTRA="--size-only"

          DRYRUN=$(aws s3 sync colors/ "s3://${R2_BUCKET}/colors/" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public, max-age=86400" \
            --exact-timestamps \
            --dryrun $EXTRA 2>&1)

          if [ -z "$DRYRUN" ]; then
            echo "colors/ -- no new or changed files, skipping"
          else
            echo "New/changed files in colors/:"
            echo "$DRYRUN"
            aws s3 sync colors/ "s3://${R2_BUCKET}/colors/" \
              --endpoint-url "$R2_ENDPOINT" \
              --cache-control "public, max-age=86400" \
              --exact-timestamps $EXTRA
            echo "colors/ synced"
          fi

      - name: Sync guildlines/
        run: |
          EXTRA=""
          [ "${{ inputs.force_sync }}" = "true" ] && EXTRA="--size-only"

          DRYRUN=$(aws s3 sync guildlines/ "s3://${R2_BUCKET}/guidelines/" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public, max-age=86400" \
            --exact-timestamps \
            --dryrun $EXTRA 2>&1)

          if [ -z "$DRYRUN" ]; then
            echo "guildlines/ -- no new or changed files, skipping"
          else
            echo "New/changed files in guildlines/:"
            echo "$DRYRUN"
            aws s3 sync guildlines/ "s3://${R2_BUCKET}/guidelines/" \
              --endpoint-url "$R2_ENDPOINT" \
              --cache-control "public, max-age=86400" \
              --exact-timestamps $EXTRA
            echo "guildlines/ synced"
          fi

      - name: Print bucket summary
        run: |
          echo "Current files in R2 bucket (${R2_BUCKET}):"
          aws s3 ls "s3://${R2_BUCKET}/" \
            --recursive \
            --endpoint-url "$R2_ENDPOINT" \
            --human-readable \
            --summarize
